name: GLaDOS check-in

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - checkin.py
      - backup_gate.py
      - tests/**
      - .github/workflows/gladosCheck.yml
  schedule:
    # 12:17 Asia/Shanghai primary; 18:43 Asia/Shanghai is backup-only.
    - cron: "17 4 * * *"
    - cron: "43 10 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  test:
    name: offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  gate:
    name: backup decision
    runs-on: ubuntu-latest
    outputs:
      run_checkin: ${{ steps.decision.outputs.run_checkin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Decide whether production check-in is needed
        id: decision
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIMARY_CRON: "17 4 * * *"
          WORKFLOW_FILE: gladosCheck.yml
        run: python backup_gate.py

  checkin:
    name: production check-in
    needs: [test, gate]
    if: needs.gate.outputs.run_checkin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Run check-in
        env:
          SITE_COOKIE: ${{ secrets.COOKIE || secrets.COOKIES }}
        run: python checkin.py
