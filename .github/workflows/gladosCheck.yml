name: GLaDOS check-in

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - checkin.py
      - tests/**
      - .github/workflows/gladosCheck.yml
  schedule:
    # 04:00 UTC = 12:00 Asia/Shanghai. Run only once per day.
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  test:
    name: offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  checkin:
    name: production check-in
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Run check-in
        env:
          SITE_COOKIE: ${{ secrets.COOKIE || secrets.COOKIES }}
        run: python checkin.py
