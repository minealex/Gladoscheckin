name: GLaDOS check-in

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - checkin.py
      - backup_gate.py
      - schedule_jitter.py
      - tests/**
      - .github/workflows/gladosCheck.yml
  schedule:
    # GitHub Actions 的 schedule 事件是"尽力而为"：官方文档明确说明高负载期会被延迟，
    # 负载足够高时"部分排队的作业会被丢弃"，且不会产生任何失败记录（连 run 都没有）。
    # 2026-10 期间平台级退化，第三方实测 15 分钟粒度的工作流只有约 64% 的时段真正产生 run。
    # 因此这里从 2 个窗口加密到 4 个，靠 backup_gate.py 去重：
    # 同一天（UTC）只要已经有一个 schedule 运行成功，其余窗口自动跳过。
    # 时间统一用 Asia/Shanghai，避免 UTC / 北京时间换算错误。
    # 分钟数刻意避开 :00 和 :30（官方指出每小时开头是负载高峰）。
    - cron: "17 12 * * *"
      timezone: "Asia/Shanghai"   # 12:17 主窗口
    - cron: "43 18 * * *"
      timezone: "Asia/Shanghai"   # 18:43 备用窗口
    - cron: "23 21 * * *"
      timezone: "Asia/Shanghai"   # 21:23 兜底窗口
    - cron: "47 0 * * *"
      timezone: "Asia/Shanghai"   # 00:47 凌晨兜底窗口

permissions:
  actions: read
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  test:
    name: offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  gate:
    name: backup decision
    runs-on: ubuntu-latest
    outputs:
      run_checkin: ${{ steps.decision.outputs.run_checkin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Decide whether production check-in is needed
        id: decision
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIMARY_CRON: "17 12 * * *"
          WORKFLOW_FILE: gladosCheck.yml
        run: python backup_gate.py

  checkin:
    name: production check-in
    needs: [test, gate]
    if: needs.gate.outputs.run_checkin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Calculate bounded schedule delay
        id: jitter
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MAX_JITTER_MINUTES: "20"
        run: python schedule_jitter.py
      - name: Wait inside the schedule window
        if: github.event_name == 'schedule' && steps.jitter.outputs.delay_seconds != '0'
        run: sleep "${{ steps.jitter.outputs.delay_seconds }}"
      - name: Install runtime dependency
        run: python -m pip install "requests>=2.32,<3"
      - name: Run check-in
        env:
          SITE_COOKIE: ${{ secrets.COOKIE || secrets.COOKIES }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python checkin.py
      - name: Hint for common failures
        if: failure()
        run: |
          echo "::notice::签到失败时请先看上一步 'Run check-in' 的输出："
          echo "::notice::1) 认证失败 -> Cookie 过期/失效（GLaDOS 约 30 天），重新登录后更新 Secret"
          echo "::notice::2) 未配置 Cookie Secret -> 检查仓库 Secret 名称是否为 COOKIE 或 COOKIES"
          echo "::notice::3) 状态请求失败 -> 站点暂时不可用，备用窗口会自动再试一次"
          echo "::notice::4) 完全没有产生 run -> GitHub schedule 被延迟/丢弃，属平台侧问题，"
          echo "::notice::   等待下一个窗口，或去 Actions 页面手动 Run workflow 补一次。"
