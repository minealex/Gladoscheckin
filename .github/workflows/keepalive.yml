name: Keepalive Workflow

on:
  schedule:
    # 每周一 00:00 自动检查一次
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  keepalive:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          time_elapsed: 45
